name: Publicar loja na VPS

on:
  push:
    branches: [main]
    paths:
      - "loja/**"
      - "docker-compose.production.yml"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: bicharoco-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bicharoco.sevenfaithtech.com/

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem da aplicação
        uses: docker/build-push-action@v6
        with:
          context: ./loja
          file: ./loja/docker/php/Dockerfile
          target: application
          push: true
          tags: |
            ghcr.io/valtersystem/bicharoco-app:${{ github.sha }}
            ghcr.io/valtersystem/bicharoco-app:latest
          cache-from: type=gha,scope=bicharoco-application
          cache-to: type=gha,mode=max,scope=bicharoco-application

      - name: Construir e publicar imagem web
        uses: docker/build-push-action@v6
        with:
          context: ./loja
          file: ./loja/docker/php/Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/valtersystem/bicharoco-web:${{ github.sha }}
            ghcr.io/valtersystem/bicharoco-web:latest
          cache-from: type=gha,scope=bicharoco-application
          cache-to: type=gha,mode=max,scope=bicharoco-web

      - name: Preparar acesso SSH restrito
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/bicharoco_deploy
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bicharoco_deploy ~/.ssh/known_hosts

      - name: Publicar commit na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/bicharoco_deploy \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "deploy $GITHUB_SHA"

